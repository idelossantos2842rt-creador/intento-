<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animación Interactiva</title>
  <style>
    /* Variables para Modo Oscuro (Predeterminado) y Claro */
    :root {
      --bg-color: #050505;
      --text-color: #ffffff;
      --panel-bg: rgba(20, 20, 20, 0.75);
      --panel-border: rgba(255, 0, 0, 0.3);
      --button-bg: #e60000;
      --button-text: #ffffff;
      --tunnel-color: rgba(255, 0, 0, 0.25);
    }

    [data-theme="light"] {
      --bg-color: #f4f4f9;
      --text-color: #1a1a1a;
      --panel-bg: rgba(255, 255, 255, 0.85);
      --panel-border: rgba(200, 0, 0, 0.4);
      --button-bg: #cc0000;
      --button-text: #ffffff;
      --tunnel-color: rgba(200, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* UI y Controles */
    .controls-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .theme-btn {
      background: var(--button-bg);
      color: var(--button-text);
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s ease, background-color 0.3s ease;
    }

    .theme-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="controls-panel">
    <span>Tema:</span>
    <button class="theme-btn" id="theme-toggle">Modo Claro</button>
  </div>

  <div id="canvas-container">
    <canvas id="animCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('animCanvas');
    const ctx = canvas.getContext('2d');
    const themeBtn = document.getElementById('theme-toggle');

    let width, height, centerX, centerY;
    let theme = 'dark';

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      centerX = width / 2;
      centerY = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Alternar Tema Claro / Oscuro
    themeBtn.addEventListener('click', () => {
      if (theme === 'dark') {
        theme = 'light';
        document.body.setAttribute('data-theme', 'light');
        themeBtn.innerText = 'Modo Oscuro';
      } else {
        theme = 'dark';
        document.body.removeAttribute('data-theme');
        themeBtn.innerText = 'Modo Claro';
      }
    });

    // Parámetros de Animación
    let frame = 0;
    const tunnelDuration = 300; // Se extendió la duración del túnel (frames)

    function drawEye(x, y, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale * 2, scale * 2); // Ojo al duplo de su tamaño original

      // Estilo del ojo: Rojo e intensidad de líneas aumentada
      ctx.strokeStyle = '#ff0000';
      ctx.fillStyle = '#ff0000';
      ctx.lineWidth = 4.5; // Líneas mucho más gruesas
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Contorno exterior del ojo
      ctx.beginPath();
      ctx.moveTo(-50, 0);
      ctx.quadraticCurveTo(0, -35, 50, 0);
      ctx.quadraticCurveTo(0, 35, -50, 0);
      ctx.closePath();
      ctx.stroke();

      // Iris exterior
      ctx.beginPath();
      ctx.arc(0, 0, 20, 0, Math.PI * 2);
      ctx.stroke();

      // Pupila central
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.fill();

      // Detalle de tomorae / líneas internas del ojo
      for (let i = 0; i < 3; i++) {
        const angle = (frame * 0.03) + (i * (Math.PI * 2 / 3));
        const px = Math.cos(angle) * 13;
        const py = Math.sin(angle) * 13;
        ctx.beginPath();
        ctx.arc(px, py, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function animate() {
      // Limpiar lienzo según el tema actual
      ctx.fillStyle = theme === 'dark' ? '#050505' : '#f4f4f9';
      ctx.fillRect(0, 0, width, height);

      // Dibujar Túnel (Duración extendida)
      const tunnelProgress = (frame % tunnelDuration) / tunnelDuration;
      const ringCount = 12;

      for (let i = 0; i < ringCount; i++) {
        const ringProgress = (tunnelProgress + (i / ringCount)) % 1;
        const radius = Math.pow(ringProgress, 2) * (Math.max(width, height) * 0.8);
        const alpha = Math.sin(ringProgress * Math.PI);

        ctx.save();
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.strokeStyle = theme === 'dark' 
          ? `rgba(255, 0, 0, ${alpha * 0.4})` 
          : `rgba(200, 0, 0, ${alpha * 0.5})`;
        ctx.lineWidth = 3 + (ringProgress * 4);
        ctx.stroke();
        ctx.restore();
      }

      // Dibujar Ojo central animado
      const eyeScale = 1 + Math.sin(frame * 0.04) * 0.1;
      drawEye(centerX, centerY, eyeScale);

      frame++;
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
